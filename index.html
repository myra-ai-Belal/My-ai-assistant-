<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lara — AI Assistant</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="aurora">

  <div id="app">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">Lara</div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
    </header>

    <!-- Orb (home screen, call মোড বন্ধ থাকলে দেখা যায়) -->
    <main class="orb-stage">
      <div id="orb" class="orb idle">
        <div class="orb-core"></div>
        <div class="orb-ring ring1"></div>
        <div class="orb-ring ring2"></div>
        <div class="orb-ring ring3"></div>
      </div>
      <div id="statusText" class="status-text">চাপুন এবং কথা বলুন, অথবা নিচে কল মোড চালু করুন</div>
    </main>

    <!-- Conversation log -->
    <section id="chatLog" class="chat-log"></section>

    <!-- Mic button + Call mode -->
    <footer class="footer">
      <button id="callModeBtn" class="call-mode-btn" aria-label="Call mode">
        📞 <span id="callModeLabel">কল মোড</span>
      </button>
      <button id="micBtn" class="mic-btn" aria-label="Talk">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
        </svg>
      </button>
    </footer>
  </div>

  <!-- ===== কল স্ক্রিন (ফোন কলের মতো, 3D চরিত্র সহ) ===== -->
  <div id="callScreen" class="call-screen hidden">
    <div class="call-top">
      <div class="call-name">Lara</div>
      <div id="callTimer" class="call-timer">00:00</div>
    </div>

    <div class="avatar-stage">
      <div id="avatar3d" class="avatar-3d idle">
        <div class="avatar-halo"></div>
        <div class="avatar-body">
          <div class="avatar-face">
            <div class="eye eye-left"><div class="pupil"></div></div>
            <div class="eye eye-right"><div class="pupil"></div></div>
            <div id="avatarMouth" class="mouth"></div>
          </div>
          <div class="avatar-shine"></div>
        </div>
        <div class="avatar-shadow"></div>
      </div>
    </div>

    <div id="callCaption" class="call-caption">কল মোড চালু হচ্ছে...</div>

    <div class="call-controls">
      <button id="muteBtn" class="call-round-btn" aria-label="Mute">🎤</button>
      <button id="endCallBtn" class="call-round-btn end" aria-label="End call">📴</button>
      <button id="speakerBtn" class="call-round-btn" aria-label="Speaker">🔊</button>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-inner">
      <div class="settings-header">
        <span>সেটিংস</span>
        <button id="closeSettings" class="icon-btn">✕</button>
      </div>

      <div class="section-title">থিম / রঙ</div>
      <div id="themePicker" class="theme-picker">
        <button class="theme-swatch" data-theme="aurora" style="background:linear-gradient(135deg,#4fd1ff,#8b5cf6)"></button>
        <button class="theme-swatch" data-theme="sunset" style="background:linear-gradient(135deg,#ff8a5c,#ff5c7a)"></button>
        <button class="theme-swatch" data-theme="emerald" style="background:linear-gradient(135deg,#22d3a5,#4fd1ff)"></button>
        <button class="theme-swatch" data-theme="royal" style="background:linear-gradient(135deg,#f6c453,#8b5cf6)"></button>
      </div>

      <div class="section-title">AI Provider — একাধিক key দিন, একটার লিমিট শেষ হলে পরেরটা automatic try হবে</div>

      <label class="field-label">1️⃣ Groq API Key</label>
      <input id="groqKey" type="password" class="field-input" placeholder="gsk_..." />
      <label class="field-label small">Groq মডেল</label>
      <input id="groqModel" type="text" class="field-input" placeholder="openai/gpt-oss-20b" />

      <label class="field-label">2️⃣ Gemini API Key</label>
      <input id="geminiKey" type="password" class="field-input" placeholder="AIza..." />
      <label class="field-label small">Gemini মডেল</label>
      <input id="geminiModel" type="text" class="field-input" placeholder="gemini-2.0-flash" />

      <label class="field-label">3️⃣ OpenRouter API Key</label>
      <input id="openrouterKey" type="password" class="field-input" placeholder="sk-or-..." />
      <label class="field-label small">OpenRouter মডেল (ফ্রি মডেল)</label>
      <input id="openrouterModel" type="text" class="field-input" placeholder="meta-llama/llama-3.3-70b-instruct:free" />

      <label class="field-label">4️⃣ OpenAI API Key (থাকলে)</label>
      <input id="openaiKey" type="password" class="field-input" placeholder="sk-..." />
      <label class="field-label small">OpenAI মডেল</label>
      <input id="openaiModel" type="text" class="field-input" placeholder="gpt-4o-mini" />

      <label class="field-label">System Prompt (Lara-র ব্যক্তিত্ব/নিয়ম)</label>
      <textarea id="systemPrompt" class="field-textarea" rows="3"></textarea>

      <div class="section-title">ভয়েস</div>
      <label class="field-label">ElevenLabs API Key (ঐচ্ছিক — realistic ভয়েস)</label>
      <input id="elevenKey" type="password" class="field-input" placeholder="ঐচ্ছিক" />
      <label class="field-label small">ElevenLabs Voice ID (ঐচ্ছিক)</label>
      <input id="elevenVoiceId" type="text" class="field-input" placeholder="ঐচ্ছিক" />

      <label class="field-label">কথা বলার ভাষা (Speech recognition)</label>
      <select id="sttLang" class="field-input">
        <option value="bn-BD">বাংলা (Bangladesh)</option>
        <option value="bn-IN">বাংলা (India)</option>
        <option value="en-US">English (US)</option>
      </select>

      <button id="saveSettings" class="save-btn">সেভ করুন</button>
      <div id="saveMsg" class="save-msg"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
